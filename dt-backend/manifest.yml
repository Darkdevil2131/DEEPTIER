---
applications:
  - name: deeptier-backend
    memory: 1G
    disk_quota: 1G
    instances: 1
    path: target/dt-backend-1.0.0-SNAPSHOT.jar
    buildpacks:
      - sap_java_buildpack_jakarta
    env:
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: "{ version: 21.+ }"
      SPRING_PROFILES_ACTIVE: hana
      DEEPTIER_INTERNAL_KEY: ((deeptier-internal-key))
    health-check-type: http
    health-check-http-endpoint: /actuator/health
    routes:
      - route: deeptier-backend-98c41646trial.cfapps.ap21.hana.ondemand.com
