applications:
  - name: deeptier-ai
    path: .
    buildpacks:
      - python_buildpack
    memory: 512M
    instances: 1
    command: exec python -m uvicorn tradepilot.main:app --host 0.0.0.0 --port "${PORT:-8000}"
    health-check-type: http
    health-check-http-endpoint: /api/v1/health
    routes:
      - route: deeptier-ai.apps.internal
    env:
      GEMINI_ENABLED: "false"
